<body>

    <!-- HEADER -->
    <header class="header">

        <h1>📋 ABSENSI KELAS</h1>

        <p><b>X RPL 1</b></p>

        <p>SMKN 2 MOJOKERTO</p>

        <small>
            Silakan isi data untuk mencatat kehadiran
        </small>

    </header>


    <main class="container">

        <!-- FORM ABSENSI -->
        <section class="card">

            <h2>📝 Isi Absensi</h2>

            <form id="absenForm">

                <div class="form-group">

                    <label for="nama">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama lengkap"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="nisn">
                        NISN
                    </label>

                    <input
                        type="number"
                        id="nisn"
                        placeholder="Masukkan NISN"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="noAbsen">
                        No. Absen
                    </label>

                    <input
                        type="number"
                        id="noAbsen"
                        placeholder="Contoh: 01"
                        min="1"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    ✓ Absen Sekarang
                </button>

            </form>

        </section>


        <!-- STATISTIK -->
        <section class="info">

            <div class="info-box">

                <strong id="jumlahHadir">
                    0
                </strong>

                <span>
                    Sudah Hadir
                </span>

            </div>


            <div class="info-box">

                <strong id="jumlahSiswa">
                    0
                </strong>

                <span>
                    Total Data
                </span>

            </div>


            <div class="info-box">

                <strong id="persentase">
                    0%
                </strong>

                <span>
                    Kehadiran
                </span>

            </div>

        </section>


        <!-- DAFTAR KEHADIRAN -->
        <section class="card">

            <h2>👥 Daftar Kehadiran</h2>

            <div class="search">

                <input
                    type="search"
                    id="search"
                    placeholder="🔎 Cari nama atau NISN..."
                >

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>No</th>

                            <th>Nama</th>

                            <th>NISN</th>

                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody id="daftarAbsen">

                        <tr>

                            <td
                                colspan="4"
                                class="empty"
                            >
                                Belum ada siswa yang absen.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        SMKN 2 MOJOKERTO • X RPL 1

    </footer>


    <script>

        /* DATA ABSENSI */

        let dataAbsen =
            JSON.parse(
                localStorage.getItem("dataAbsen")
            ) || [];


        const form =
            document.getElementById("absenForm");

        const daftar =
            document.getElementById("daftarAbsen");

        const search =
            document.getElementById("search");


        /* MENAMPILKAN DATA */

        function tampilkanData(filter = "") {

            daftar.innerHTML = "";


            let dataFilter =
                dataAbsen.filter(function(data) {

                    return (
                        data.nama
                            .toLowerCase()
                            .includes(filter.toLowerCase())
                        ||
                        data.nisn.includes(filter)
                    );

                });


            if (dataFilter.length === 0) {

                daftar.innerHTML = `

                    <tr>

                        <td
                            colspan="4"
                            class="empty"
                        >
                            Belum ada data absensi.
                        </td>

                    </tr>

                `;

                updateStatistik();

                return;
            }


            dataFilter.forEach(function(data) {

                let row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${data.noAbsen}
                    </td>

                    <td>
                        ${data.nama}
                    </td>

                    <td>
                        ${data.nisn}
                    </td>

                    <td>

                        <span class="status">
                            Hadir
                        </span>

                    </td>

                `;


                daftar.appendChild(row);

            });


            updateStatistik();

        }


        /* STATISTIK */

        function updateStatistik() {

            const jumlah =
                dataAbsen.length;


            document.getElementById(
                "jumlahHadir"
            ).textContent = jumlah;


            document.getElementById(
                "jumlahSiswa"
            ).textContent = jumlah;


            document.getElementById(
                "persentase"
            ).textContent =
                jumlah > 0
                ? "100%"
                : "0%";

        }


        /* SUBMIT ABSENSI */

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const nama =
                    document
                    .getElementById("nama")
                    .value
                    .trim();


                const nisn =
                    document
                    .getElementById("nisn")
                    .value
                    .trim();


                const noAbsen =
                    document
                    .getElementById("noAbsen")
                    .value
                    .trim();


                /* CEK NISN */

                const sudahAbsen =
                    dataAbsen.some(
                        function(data) {

                            return data.nisn === nisn;

                        }
                    );


                if (sudahAbsen) {

                    alert(
                        "⚠️ NISN tersebut sudah melakukan absensi!"
                    );

                    return;

                }


                /* SIMPAN DATA */

                dataAbsen.push({

                    nama: nama,

                    nisn: nisn,

                    noAbsen: noAbsen

                });


                localStorage.setItem(

                    "dataAbsen",

                    JSON.stringify(dataAbsen)

                );


                /* RESET FORM */

                form.reset();


                tampilkanData();


                alert(
                    "✅ Absensi berhasil dicatat!"
                );

            }
        );


        /* PENCARIAN */

        search.addEventListener(
            "input",
            function() {

                tampilkanData(
                    this.value
                );

            }
        );


        /* JALANKAN SAAT HALAMAN DIBUKA */

        tampilkanData();

    </script>

</body>
</html>
